# флаг включающий параллельный режим запуска тестов
junit.jupiter.execution.parallel.enabled=true

# флаг определяющий режим запуска тестов(в одном потоке или параллельном)
#возможные значения: same_thread или concurrent
# same_thread -> тесты всегда запускаются в одном потоке, даже если параллельность включена
# concurrent -> тесты допускают параллельное выполнение
junit.jupiter.execution.parallel.mode.default=concurrent

# флаг определяющий стратегию распределения потоков
# возможные значения: dynamic и fixed
# dynamic -> кол-во потоков выбирается автоматически (примерно = числу CPU)
# fixed -> ты сам задаешь точное кол-во потоков(см. след флаг)
junit.jupiter.execution.parallel.config.strategy=fixed

# флаг указывающий кол-во параллельных потоков
# этот параметр игнорируется, если ты используешь dynamic вместо fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=6